server:
  port: 8080

spring:
  application:
    name: pisces
  datasource:
    url: jdbc:h2:file:./data/pisces
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
